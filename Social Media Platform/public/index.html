<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniSocial</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/feed">Mini<span>Social</span></a>
      <nav class="nav-links" id="nav-links" hidden>
        <a href="#/feed" data-nav="feed">Feed</a>
        <a href="#/suggestions" data-nav="suggestions">Suggestions</a>
        <a href="#/profile" data-nav="profile">Profile</a>
        <button type="button" class="btn btn-ghost btn-sm" id="logout-btn">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="view-auth" class="view" hidden></section>
    <section id="view-feed" class="view" hidden>
      <div class="layout">
        <div class="col-main">
          <div id="composer-slot"></div>
          <h2 class="section-title">Latest posts</h2>
          <div id="posts-list"></div>
        </div>
        <aside class="col-side" id="side-panel"></aside>
      </div>
    </section>
    <section id="view-suggestions" class="view" hidden>
      <div class="layout layout-single">
        <div class="col-main">
          <h2 class="section-title">People you may know</h2>
          <div id="suggestions-grid"></div>
        </div>
      </div>
    </section>
    <section id="view-profile" class="view" hidden>
      <div class="layout layout-single">
        <div class="col-main">
          <div id="profile-card"></div>
          <div id="profile-edit-slot"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-root" aria-live="polite"></div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/templates.js"></script>
  <script src="/js/feed.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
