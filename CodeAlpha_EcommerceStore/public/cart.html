<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart | CodeAlpha Store</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">CodeAlpha<span>Store</span></a>
      <nav class="nav">
        <a href="/">Products</a>
        <a href="/cart.html" class="nav-cart active">Cart <span id="cart-count" class="cart-count">0</span></a>
        <span id="auth-area"></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-head">
      <h1>Shopping Cart</h1>
      <p id="cart-subtitle" class="subtitle"></p>
    </section>

    <div id="status-area"></div>

    <section id="cart-layout" class="cart-layout" aria-live="polite">
      <div id="cart-items"></div>

      <aside id="cart-summary" class="cart-summary">
        <h2>Order Summary</h2>
        <div class="summary-row summary-total">
          <span>Total</span>
          <strong id="cart-total">$0.00</strong>
        </div>
        <button id="checkout-btn" class="btn btn-primary">Proceed to Checkout</button>
        <button id="clear-cart-btn" class="btn btn-danger">Clear Cart</button>
        <a href="/" class="btn btn-outline">Continue Shopping</a>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CodeAlpha Store &middot; Simple E-commerce Task</p>
  </footer>

  <script src="/js/cart-store.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
