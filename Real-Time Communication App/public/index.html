<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTC App - Auth</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-container">
    <h1 class="auth-title">Real-Time Communication</h1>
    <p class="auth-subtitle">Video conferencing made simple</p>

    <div class="auth-tabs">
      <button class="tab active" id="tab-login">Login</button>
      <button class="tab" id="tab-register">Register</button>
    </div>

    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary">Login</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <div class="form-group">
        <label for="register-name">Name</label>
        <input type="text" id="register-name" autocomplete="name" required />
      </div>
      <div class="form-group">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" autocomplete="new-password" minlength="8" required />
      </div>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <div id="auth-message" class="auth-message"></div>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
